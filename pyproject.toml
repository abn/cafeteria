[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cafeteria"
version = "0.23.0"
description = "Cafeteria: A convenience package providing various building blocks enabling pythonic patterns."
authors = [
    { name = "Arun Babu Neelicattu", email = "arun.neelicattu@gmail.com" },
    { name = "Josha Inglis", email = "joshainglis@gmail.com" },
    { name = "Betsy Alpert", email = "lizbeth.alpert@gmail.com" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
yaml = [
    "PyYAML>=3.13,!=6.0.0,!=5.4.0,!=5.4.1",
]

[project.urls]
Repository = "https://github.com/abn/cafeteria"

[dependency-groups]
dev = [
    "coverage[toml]>=7.4",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "ty>=0.0.74",
]

[tool.poetry]
packages = [
    { include = "cafeteria", from = "src" },
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (unused variables, undefined names)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common design bugs & performance traps)
    "UP",  # pyupgrade (modern Python 3.10+ syntax upgrades)
    "SIM", # flake8-simplify (simplifies complex conditional logic)
    "N",   # pep8-naming (naming conventions)
    "RUF", # Ruff-specific rules & best practices
]
ignore = [
    "E501",   # Line length (handled cleanly by ruff format)
    "B008",   # Do not perform function call in argument defaults
    "SIM108", # Use ternary operator instead of if-else
]

[tool.ruff.lint.isort]
known-first-party = ["cafeteria"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov --cov-append --cov-report=term"
asyncio_mode = "auto"
testpaths = [
    "tests",
]

[tool.coverage.run]
branch = true
parallel = true
data_file = ".coverage/data"
source = [
    "cafeteria",
]
omit = [
    "tests/*",
]

[tool.coverage.paths]
source = [
    "src",
]

[tool.coverage.report]
skip_empty = true
ignore_errors = true

[tool.coverage.html]
directory = ".coverage/html"

[tool.coverage.xml]
output = ".coverage/coverage.xml"

[tool.coverage.json]
output = ".coverage/coverage.json"
