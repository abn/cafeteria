[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
src_paths = ["src", "test"]
known_first_party = "cafeteria"

[tool.poetry]
name = "cafeteria"
packages = [
    { include = "cafeteria", from = "src" },
]
version = "0.23.0a0"
repository = "https://github.com/abn/cafeteria"
description = "Cafeteria: A convenience package providing various building blocks enabling pythonic patterns."
authors = [
    "Arun Babu Neelicattu <arun.neelicattu@gmail.com>",
    "Josha Inglis <joshainglis@gmail.com>",
    "Betsy Alpert <lizbeth.alpert@gmail.com>"
]
license = "APLv2"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
keywords = []
readme = "README.rst"


[tool.poetry.dependencies]
python = "^3.8"
PyYAML = { version = ">=3.13,!=6.0.0,!=5.4.0,!=5.4.1", optional = true }

[tool.poetry.extras]
# PyYAML is only required when YAML logging configuration is used.
yaml = ["PyYAML"]

[tool.poetry.group.dev.dependencies]
coverage = { version = "^7.4", extras = ["toml"]}
pre-commit = [
    { version = "<=3.5.0", python = "<3.9" },
    { version = "^3.6", python = "^3.9" }
]
pytest = "^8.0"
pytest-cov = "^4.1"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov --cov-append --cov-report=term"
testpaths = [
    "tests",
]

[tool.coverage.run]
branch = true
parallel = true
data_file = ".coverage/data"
source = [
    "cafeteria",
]
omit = [
    "tests/*",
]

[tool.coverage.paths]
source = [
    "src",
]

[tool.coverage.report]
skip_empty = true
ignore_errors = true

[tool.coverage.html]
directory = ".coverage/html"

[tool.coverage.xml]
output = ".coverage/coverage.xml"

[tool.coverage.json]
output = ".coverage/coverage.json"
